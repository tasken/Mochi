[build]
  # COMMIT_REF is a built-in Netlify build variable (full commit SHA).
  command = "bash fetch-firmware.sh && bash bust-cache.sh app \"${COMMIT_REF:0:7}\""
  publish = "app"

# Skip production deploys entirely (production branch is "main" per
# Netlify's default site setting) — only branch deploys run.
[context.production]
  ignore = "exit 0"
